name: Fetch feeds

on:
  schedule:
    # Every 15 minutes. GitHub often runs scheduled jobs a few minutes
    # late under load — that's fine for headlines.
    - cron: "*/15 * * * *"
  workflow_dispatch:      # lets you trigger a refresh by hand
  push:
    branches: [main]
    paths:
      - "scripts/fetch-feeds.mjs"
      - ".github/workflows/fetch-feeds.yml"

# Needed so the job can commit feeds.json back to the repo.
permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install parser
        run: npm install --no-save --no-audit --no-fund fast-xml-parser

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another run (scheduled, or triggered by a push) can land a commit
          # between our checkout and our push, which would make this a
          # non-fast-forward and fail the job. feeds.json is regenerated in
          # full every run, so there is nothing to merge — we just re-parent
          # our version onto whatever the remote now has, and retry.
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --soft FETCH_HEAD
            git add feeds.json

            if git diff --staged --quiet; then
              echo "No headline changes — nothing to commit."
              exit 0
            fi

            git commit -m "Update headlines [skip ci]"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt — another run got there first; retrying."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1
