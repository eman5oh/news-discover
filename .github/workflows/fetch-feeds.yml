name: Fetch feeds

on:
  schedule:
    # Every 15 minutes. GitHub often runs scheduled jobs a few minutes
    # late under load — that's fine for headlines.
    - cron: "*/15 * * * *"
  workflow_dispatch:      # lets you trigger a refresh by hand
  push:
    branches: [main]
    paths:
      - "scripts/fetch-feeds.mjs"
      - ".github/workflows/fetch-feeds.yml"

# Needed so the job can commit feeds.json back to the repo.
permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install parser
        run: npm install --no-save --no-audit --no-fund fast-xml-parser

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          if git diff --staged --quiet; then
            echo "No headline changes — nothing to commit."
          else
            git commit -m "Update headlines [skip ci]"
            git push
          fi
