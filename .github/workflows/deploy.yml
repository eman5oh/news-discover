name: Build and deploy

on:
  schedule:
    # Every 15 minutes. GitHub runs scheduled jobs late when it's busy,
    # which is fine for headlines.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # lets you refresh by hand
  push:
    branches: [main]

permissions:
  contents: write   # for the keep-alive commit below
  pages: write
  id-token: write

# A newer build supersedes an in-flight older one — there's nothing to
# preserve in a half-finished headline fetch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install parser
        run: npm install --no-save --no-audit --no-fund fast-xml-parser

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp feeds.json _site/
          echo "Site contents:"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days of repository
        # inactivity. This workflow deploys an artifact and never commits,
        # so nothing was resetting that clock — it got disabled once
        # already, and the site silently served days-old headlines.
        #
        # Push a dated marker when the repo has been quiet for a while.
        # ~12 tiny commits a year, which is negligible for repo size.
        run: |
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST_COMMIT_TS ) / 86400 ))
          echo "Last commit was ${AGE_DAYS} days ago."
          if [ "$AGE_DAYS" -lt 25 ]; then
            echo "Repo is active enough; no keep-alive needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "Keep scheduled workflow alive [skip ci]"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
